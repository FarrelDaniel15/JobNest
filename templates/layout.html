<!DOCTYPE html>

<html lang="en">

    <head>

        <meta charset="utf-8">
        <meta name="viewport" content="initial-scale=1, width=device-width">

        <!-- http://getbootstrap.com/docs/5.3/ -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <link href="/static/styles.css" rel="stylesheet">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

        <!-- Image for the icon of the website -->
        <link href="/static/image/JobNest_Small_Logo.png" rel="icon">

        <!-- Include the Tailwind CSS script -->
        <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
        <!-- Include the Flowbite JavaScript for the modal popup -->
        <script src="https://cdn.jsdelivr.net/npm/flowbite@2.5.2/dist/flowbite.min.js"></script>
        
        <!-- Navigation Bar Templates from https://prebuiltui.com/components/navbar -->
        <script>
            let menuOpen = false;
            function toggleMenu() {
                menuOpen = !menuOpen;
                const menu = document.getElementById('mobileMenu');
                const bar1 = document.getElementById('bar1');
                const bar2 = document.getElementById('bar2');
                const bar3 = document.getElementById('bar3');
                if (menuOpen) {
                    menu.classList.remove('hidden');
                    menu.classList.add('flex');
                    bar1.classList.add('rotate-45', 'translate-y-2');
                    bar2.classList.add('opacity-0');
                    bar3.classList.add('-rotate-45', '-translate-y-2');
                } else {
                    menu.classList.add('hidden');
                    menu.classList.remove('flex');
                    bar1.classList.remove('rotate-45', 'translate-y-2');
                    bar2.classList.remove('opacity-0');
                    bar3.classList.remove('-rotate-45', '-translate-y-2');
                }
            }
        </script>

        <title>JobNest: {% block title %}{% endblock %}</title>

    </head>

    <body>

        <nav class="bg-white px-6 md:px-12 lg:px-24 xl:px-40 py-4 flex items-center justify-between relative">
            <a href="/dashboard">
                <img src="{{ url_for('static', filename='image/JobNest_Logo.jpg') }}" alt="JobNest Logo" width="151" height="36" />
            </a>

            {% if session["user_id"] %}
                <!-- Desktop Nav Items (adapted from prebuiltUI)-->
                <div class="hidden md:flex items-center bg-zinc-50 border border-zinc-200 rounded-full px-1 py-1 gap-2">
                    <a href="/dashboard" class="px-4 py-1.5 rounded-full text-sm transition-colors text-zinc-500 hover:text-zinc-400 nav-text">Home</a>
                    <a href="/add" class="px-4 py-1.5 rounded-full text-sm transition-colors text-zinc-500 hover:text-zinc-400 nav-text">Add</a>
                    <a href="/logout" class="px-4 py-1.5 rounded-full text-sm transition-colors text-zinc-500 hover:text-zinc-400 nav-text">Log Out</a>
                </div>

                <!-- Mobile Hamburger (adapted from prebuiltUI)-->
                <button id="hamburger" onclick="toggleMenu()" class="md:hidden flex flex-col gap-1.5 cursor-pointer bg-transparent border-0 p-1">
                    <span id="bar1" class="block w-6 h-0.5 bg-zinc-800 transition-transform"></span>
                    <span id="bar2" class="block w-6 h-0.5 bg-zinc-800 transition-opacity"></span>
                    <span id="bar3" class="block w-6 h-0.5 bg-zinc-800 transition-transform"></span>
                </button>

                <!-- Mobile Menu (adapted from prebuiltUI)-->
                <div id="mobileMenu" class="hidden absolute top-full left-0 w-full bg-white border-t border-zinc-200 flex-col p-5 gap-1 md:hidden z-50">
                    <a href="/dashboard" class="block px-4 py-2.5 rounded-lg text-sm text-zinc-500 hover:bg-zinc-50 nav-text">Home</a>
                    <a href="/add" class="block px-4 py-2.5 rounded-lg text-sm text-zinc-500 hover:bg-zinc-50 nav-text">Add</a>
                    <a href="/logout" class="block px-4 py-2.5 rounded-lg text-sm text-zinc-500 hover:bg-zinc-50 nav-text">Log Out</a>
                </div>
            {% else %}
                <!-- Desktop Nav Items (adapted from prebuiltUI)-->
                <div class="hidden md:flex items-center bg-zinc-50 border border-zinc-200 rounded-full px-1 py-1 gap-2">
                    <a href="/" class="px-4 py-1.5 rounded-full text-sm transition-colors text-zinc-500 hover:text-zinc-400 nav-text">Home</a>
                    <a href="/register" class="px-4 py-1.5 rounded-full text-sm transition-colors text-zinc-500 hover:text-zinc-400 nav-text">Register</a>
                    <a href="/login" class="px-4 py-1.5 rounded-full text-sm transition-colors text-zinc-500 hover:text-zinc-400 nav-text">Log In</a>
                </div>

                <!-- Mobile Hamburger (adapted from prebuiltUI)-->
                <button id="hamburger" onclick="toggleMenu()" class="md:hidden flex flex-col gap-1.5 cursor-pointer bg-transparent border-0 p-1">
                    <span id="bar1" class="block w-6 h-0.5 bg-zinc-800 transition-transform"></span>
                    <span id="bar2" class="block w-6 h-0.5 bg-zinc-800 transition-opacity"></span>
                    <span id="bar3" class="block w-6 h-0.5 bg-zinc-800 transition-transform"></span>
                </button>

                <!-- Mobile Menu (adapted from prebuiltUI)-->
                <div id="mobileMenu" class="hidden absolute top-full left-0 w-full bg-white border-t border-zinc-200 flex-col p-5 gap-1 md:hidden z-50">
                    <a href="/" class="block px-4 py-2.5 rounded-lg text-sm text-zinc-500 hover:bg-zinc-50 nav-text">Home</a>
                    <a href="/register" class="block px-4 py-2.5 rounded-lg text-sm text-zinc-500 hover:bg-zinc-50 nav-text">Register</a>
                    <a href="/login" class="block px-4 py-2.5 rounded-lg text-sm text-zinc-500 hover:bg-zinc-50 nav-text">Log In</a>
                </div>
            {% endif %}
        </nav>


        <main class="container py-5 text-center">
            {% block main %}{% endblock %}
        </main>

        <!-- Footer generated by Google Gemini with adaptation -->
        <footer class="mt-auto border-t border-zinc-200 bg-white py-6 px-6 md:px-12 lg:px-24 xl:px-40">
            <div class="flex flex-col sm:flex-row items-center justify-between gap-4 text-sm text-zinc-500">
                
                <!-- Brand / Copyright -->
                <p class="m-0">
                    &copy; 2026 <span class="font-semibold text-zinc-700">JobNest</span>. All rights reserved.
                </p>

                <!-- Quick Links / GitHub -->
                <div class="flex items-center gap-6">
                    <a href="https://github.com/your-username/your-repo-name" target="_blank" rel="noopener noreferrer" class="flex items-center gap-2 hover:text-zinc-800 transition-colors">
                        <!-- GitHub SVG Icon -->
                        <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24" aria-hidden="true">
                            <path fill-rule="evenodd" clip-rule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.53 1.032 1.53 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"/>
                        </svg>
                        <span>GitHub Repository</span>
                    </a>
                </div>

            </div>
        </footer>
    </body>
</html>
